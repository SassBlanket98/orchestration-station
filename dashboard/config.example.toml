# Copy to ~/.config/stagewatch/config.toml or set STAGEWATCH_CONFIG to another path.

port = 8744
scan_interval_s = 1.5
discover_interval_s = 15
monitor_url = "http://127.0.0.1:8743"

# Optional quota service integration. Keep the service on loopback.
# quota_service_url = "http://127.0.0.1:8787"
# quota_service_secret_file = "~/.config/stagewatch/quota-secret"

# Optional browser push setup.
# push_vapid_private_key_file = "~/.config/stagewatch/vapid-private.pem"
# push_subject = "mailto:admin@example.com"
# push_store_file = "~/.config/stagewatch/push.json"
